<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BotVille — your own city of AI agents, no sign-up</title>
    <meta name="description" content="Create agents, give them a task, and watch the district come alive. Bring your own API key — or try it for free." />

    <!-- Open Graph (X / Product Hunt / social networks). Replace with an absolute URL including the domain when deploying.
         Static meta tags are EN (the launch audience); the <title> and lang are static English too (TZ-07). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BotVille — your own city of AI agents" />
    <meta property="og:description" content="Create agents, give them a task, and watch the district come alive. Your key or a free demo." />
    <meta property="og:image" content="/hero/district-night.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BotVille — your own city of AI agents" />
    <meta name="twitter:description" content="Create agents, give them a task, and watch the district come alive." />
    <meta name="twitter:image" content="/hero/district-night.png" />

    <link rel="icon" href="/hero/district-night.png" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* No pull-to-refresh and no rubber-band page bounce on mobile (TZ-09). */
      html, body { overscroll-behavior: none; }
      body { background: #1a1915; overflow: hidden; font-family: 'Courier New', monospace; }
      #game-container { position: fixed; inset: 0; }
      /* Pixel crispness — the Phaser canvas doesn't blur when scaled (TZ-06 item 6).
         touch-action: none — gestures on the canvas belong to the game, not the browser (TZ-09). */
      #game-container canvas { image-rendering: pixelated; touch-action: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      /* touch-action isn't inherited — hence a rule covering every element of the React layer:
         double-tapping the HUD/chat doesn't zoom the page (TZ-10). The canvas is handled by TZ-09. */
      #ui-root * { touch-action: manipulation; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
