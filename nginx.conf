server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Only the platform frontend may iframe the town (Plan 03 Task 3) — explicit
  # origins, never '*'. There is no env templating in this deploy (the file is
  # COPY'd verbatim into the image by Dockerfile.client), so production
  # origins are edited HERE at deploy time; the value below is the dev
  # default. See DEPLOY.md "Embedding (frame-ancestors CSP)".
  # NOTE (nginx add_header inheritance): locations that declare their own
  # add_header drop this one — fine for /assets/ (images are not documents),
  # but any future location serving HTML must re-state it.
  add_header Content-Security-Policy "frame-ancestors http://localhost:3000";

  # Pixel art must never be re-encoded or transformed in transit.
  location /assets/ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # A baked sheet that is not there yet is not an error — AppearanceResolver
  # falls back to a default sheet (spec §8.3). Keep 404s cheap and quiet.
  location /assets/baked/ {
    add_header Cache-Control "public, max-age=86400, immutable";
    access_log off;
    try_files $uri =404;
  }

  # SPA fallback — client-side routes all resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
