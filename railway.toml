# Railway config for the BotVille server.
# IMPORTANT: in the Railway service settings leave Root Directory EMPTY (= repo root).
# This is a monorepo with npm workspaces — the server depends on @botville/shared, so
# install/build must run from the root, otherwise the workspace dependency won't resolve.
#
# Node is pinned to 24 via .nvmrc + engines (required for node:sqlite without a flag).

[build]
builder = "nixpacks"
# turbo will build @botville/shared (the dependency) and then the server — we don't touch the client.
# --include=dev is MANDATORY: the service has NODE_ENV=production set, which makes
# `npm install` skip devDependencies (typescript, turbo) by default →
# the @botville/shared build failed with `tsc: exited (127)`. The flag forces the dev tools
# into the build image (they aren't needed at runtime, start runs the prebuilt dist).
buildCommand = "npm install --include=dev && npx turbo build --filter=@botville/server"

[deploy]
startCommand = "node packages/server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
